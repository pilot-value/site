    applyTheme(localStorage.getItem('pv-theme')||'light');

    /* ★ pv_pay_rows() raises 42501 when signed out. Send people to login rather than
         showing an error (login.html safePath() keeps pathname + search + hash).
       actual-pay.js awaits this promise before firing the RPC, so it never runs twice. */
    window.PV_SESSION = (async function () {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'login.html?redirect='
          + encodeURIComponent('actual-pay.html' + (window.location.search || '') + (window.location.hash || ''));
        return null;
      }
      return session;
    }());
