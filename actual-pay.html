    /* ★ pv_pay_rows() は未ログインだと 42501 で落ちる。エラー文言を出すのではなく

       actual-pay.js はこの Promise を待ってから RPC を撃つ＝二重に走らない。 */
    window.PV_SESSION = (async function () {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        window.location.href = 'login.html?redirect='
          + encodeURIComponent('actual-pay.html' + (window.location.search || '') + (window.location.hash || ''));
        return null;
      }
      return session;
    }());
