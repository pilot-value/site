  <!-- ════════════════════════════════════════════════════════════════
       この住所は「MY PAGE の ③ YOUR PAY」へ送るだけの1枚。

       ★2026-09-06、マイレポートの中身は profile.html（MY PAGE）へ統合した。
         同じ my_pay_reports() を2つの画面が別々に描いていて、
         互いを指す往復リンクで人が行き来していたのをやめた。

       ⚠️ **この URL は消せない。** 送信済みのお知らせメールが指している
          （mail-bot/announce-mail.mjs:406 の meUrl）。404 にすると
          過去に送ったメールが全部行き止まりになる。

       ★search と hash を落とさない。?new=1 は給与を出した直後の合図で、
         これが消えると「出せました」の見え方が変わる。
       ★hash が付いていないときだけ #your-pay を足す。
         profile.html#pay-tracker のような古い行き先はそのまま通す。
       ★location.replace を使う（history に積まない）。
         積むと「戻る」でここへ来て、また転送されて前へ進めなくなる。
       ★ログインの見張りは置かない。profile.html 自身が
         未ログインの人を login.html?redirect=… へ送る。
       ════════════════════════════════════════════════════════════════ -->
