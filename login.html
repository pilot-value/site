    function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('pv-theme',t);const b=document.getElementById('theme-toggle');if(b)b.innerHTML=t==='dark'?SUN:MOON;}
    applyTheme(localStorage.getItem('pv-theme')||'light');

         （?next=https://evil.com/x.html が .html で終わってしまうため）。 */
    function safePath(to){
      if (!to) return '';
      if (/^[a-z][a-z0-9+.-]*:/i.test(to)) return '';      // http: javascript: data: …
      if (to.startsWith('//') || to.includes('\\')) return '';
      try {
        const u = new URL(to, location.href);
        return u.origin === location.origin ? u.pathname + u.search + u.hash : '';
      } catch (e) { return ''; }

      const q = new URLSearchParams(location.search);

    /* ★「新規登録」へ渡すときに戻り先を落とさない。
       口コミを書きに来た人の経路は submit-review.html → login.html?next=… → 新規登録
       で、ここが素の signup.html だったため、その1リンクで意図が消えていた
       （登録後は profile.html に着地し、口コミへ戻る導線が無かった）。 */
    (function(){
      const a = document.getElementById('to-signup');
      if (!a) return;
      const to = getRedirect();
      if (to && to !== 'profile.html') a.href = 'signup.html?next=' + encodeURIComponent(to);
    })();

    // pv-session.js が期限切れで消したときの案内（一度出したら消す）
    (function(){
      let expired = false;
      try { expired = sessionStorage.getItem('pv_expired') === '1'; sessionStorage.removeItem('pv_expired'); } catch(e){}
      if (!expired) expired = new URLSearchParams(location.search).get('expired') === '1';
      if (expired) document.getElementById('expired-notice').style.display = 'block';
    })();

    // 既にログイン済みならリダイレクト
    (async function(){
      const { data:{ session } } = await sb.auth.getSession();
      if(session) window.location.href = getRedirect();
    })();

    /* ログイン成功後の後始末。パスワード・OTP のどちらから入っても同じことをする。
       ここを2箇所に書くと、片方だけ直して解放が復活しない事故になる。 */
    async function afterLogin(user) {
      // プロフィール取得（プロフィール未作成でも必ずpv_userを保存）
      const { data: profile } = await sb.from('profiles').select('*').eq('id', user.id).single();
      const userData = profile
        ? {...profile, email: user.email}
        : { id: user.id, email: user.email, name: (user.email||'').split('@')[0] };
      localStorage.setItem('pv_user', JSON.stringify(userData));

      // pv-session.js の無操作カウントをここから開始する
      try { localStorage.setItem('pv_last_active', String(Date.now()));
            localStorage.setItem('pv_session_start', String(Date.now())); } catch(e){}

      // 口コミ投稿済み確認 → 再解放（匿名 reviews_v2 を proof_hash 群で照合＋旧 reviews 後方互換）
      try { if (window.pvCheckReunlock) await pvCheckReunlock(sb, user.id); } catch(e){}

      window.location.href = getRedirect();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('login-error');
      const btn      = document.getElementById('login-btn');
      errEl.style.display = 'none';
      btn.textContent = 'ログイン中…'; btn.disabled = true;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = 'メールアドレスまたはパスワードが正しくありません';
        errEl.style.display = 'block';
        btn.textContent = 'ログイン'; btn.disabled = false;
        return;
      }

      await afterLogin(data.user);
    }

    /* ── メールOTP ──
       signInWithOtp はメールを1通送る。テンプレートは {{ .Token }} だけを載せ、
       {{ .ConfirmationURL }} は出さない（2026-08-22）。リンクを押した人は
       メールアプリの中の別ブラウザに移ってしまい、給与データの預かり証を失うため。
       ★テンプレートは「Confirm signup（初めての人）」と「Magic Link（既存の人）」の
         2枚ある。片方だけ直すと、そちらの人だけコードが出ない。 */
    let otpEmail = '';

    /* ★同じ「コードを送る」仕掛けを2つの目的で使い回している。どちらで来たかを覚えておく。
         'login' … 自分でコードログインを選んだ人。従来どおり素通しする
                   （画面に「パスワードは要りません」と書いてあるので、ここで設定を強いない）
         'reset' … パスワードを忘れた人。コードで入れて終わりにすると一生思い出さないので、
                   入った直後に設定の段を挟む */
    let otpIntent   = 'login';
    let pendingUser = null;

    const EMAIL_STEP_COPY = {
      login: {
        title: 'メールでログイン',
        note:  'メールアドレスを入力してください。<br>'
             + '6桁のログインコードをお送りします。パスワードは要りません。',
      },
      reset: {
        title: 'パスワードの再設定',
        note:  '登録したメールアドレスを入力してください。<br>'
             + '6桁のコードをお送りします。コードで入ったあと、その場で新しいパスワードを設定できます。',
      },
    };

    // .error-msg は赤。再送の「送りました」だけ緑（.is-ok）にするので、次に使う前に必ず戻す。
    function resetMsg(el) {
      el.style.display = 'none';
      el.classList.remove('is-ok');
    }

    /* 宛先を入れる段を出す。上のフォームに打ちかけていたら、それを引き継ぐ。
       引数なしの呼び出し（従来の2箇所）は 'login' のまま＝挙動が変わらない。 */
    function showEmailStep(intent) {
      otpIntent = (intent === 'reset') ? 'reset' : 'login';
      const copy = EMAIL_STEP_COPY[otpIntent];
      document.getElementById('email-step-title').textContent = copy.title;
      document.getElementById('email-step-note').innerHTML    = copy.note;

      const input = document.getElementById('otp-email');
      const typed = document.getElementById('email').value.trim();
      if (typed && !input.value) input.value = typed;
      resetMsg(document.getElementById('email-error'));
      resetMsg(document.getElementById('otp-error'));
      document.getElementById('login-form').style.display     = 'none';
      document.getElementById('otp-step').style.display       = 'none';
      document.getElementById('password-step').style.display  = 'none';
      document.getElementById('email-step').style.display     = 'block';
      input.focus();
    }

    async function startOtp() {
      const sendBtn   = document.getElementById('otp-send-btn');
      const resendBtn = document.getElementById('otp-resend-btn');
      const input     = document.getElementById('otp-email');

      /* ★再送はコード入力の段から押される。そのとき #email-step は隠れていて、
           その中にある #email-error に書いても誰にも見えない。出す先を段で選ぶ。 */
      const onOtpStep = document.getElementById('otp-step').style.display === 'block';
      const errEl = document.getElementById(onOtpStep ? 'otp-error' : 'email-error');
      resetMsg(errEl);

      // 再送は「さっき送った宛先」に送る。入力欄を触られていても宛先は変えない。
      const email = onOtpStep ? otpEmail : input.value.trim().toLowerCase();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = 'メールアドレスを正しく入力してください';
        errEl.style.display = 'block';
        if (!onOtpStep) input.focus();
        return;
      }

      const active = onOtpStep ? resendBtn : sendBtn;
      const label  = active.innerHTML;   // 送信ボタンはアイコンを持つので innerHTML で戻す
      active.disabled = true;
      active.textContent = '送信中…';

      /* 戻り先の作り方は handleGoogle と同じ式にする（getRedirect の同一オリジン検証を通す）。
         ★ただし再設定のときだけは戻り先を profile.html のパスワード欄に固定する。
           コードを打った人はこの画面に戻ってくるが、戻り先を分けておかないと
           再設定で来た人が設定画面を一度も見ずに元の場所へ飛ばされる。 */
      const to = (otpIntent === 'reset') ? 'profile.html#password-card' : getRedirect();
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: 'https://pilot-value.com/auth-callback.html'
                         + (to === 'profile.html' ? '' : '?next=' + encodeURIComponent(to)),
          shouldCreateUser: true,
        }
      });

      active.disabled = false;
      active.innerHTML = label;

      if (error) {
        errEl.textContent = (error.status === 429)
          ? '送信の間隔が短すぎます。少し時間をおいてからお試しください。'
          : 'メールを送信できませんでした: ' + error.message;
        errEl.style.display = 'block';
        return;
      }

      otpEmail = email;
      if (onOtpStep) {
        errEl.textContent = 'メールを再送しました。';
        errEl.classList.add('is-ok');
        errEl.style.display = 'block';
      }
      document.getElementById('otp-note').innerHTML =
        '<b>' + email.replace(/[<>&]/g, '') + '</b> にメールを送りました。<br>'
        + 'この画面に、届いた6桁のコードを入力してください。';
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('email-step').style.display = 'none';
      document.getElementById('otp-step').style.display   = 'block';
      document.getElementById('otp-code').focus();
    }

    // 宛先を打ち終えて Enter でも送れるようにする（送信ボタンまで戻らせない）
    document.getElementById('otp-email').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); startOtp(); }
    });

    function backToPassword() {
      otpIntent = 'login';
      document.getElementById('otp-step').style.display      = 'none';
      document.getElementById('email-step').style.display    = 'none';
      document.getElementById('password-step').style.display = 'none';
      resetMsg(document.getElementById('otp-error'));
      resetMsg(document.getElementById('email-error'));
      document.getElementById('login-form').style.display = 'block';
    }

    async function verifyOtpCode() {
      const token = document.getElementById('otp-code').value.trim();
      const errEl = document.getElementById('otp-error');
      const btn   = document.getElementById('otp-verify-btn');
      resetMsg(errEl);

      if (!/^\d{6}$/.test(token)) {
        errEl.textContent = '6桁の数字を入力してください';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = '確認中…'; btn.disabled = true;
      const { data, error } = await sb.auth.verifyOtp({ email: otpEmail, token, type: 'email' });

      if (error || !data || !data.user) {
        errEl.textContent = 'コードが正しくないか、有効期限が切れています。再送してお試しください。';
        errEl.style.display = 'block';
        btn.textContent = 'コードで進む'; btn.disabled = false;
        return;
      }

      // 忘れた人はここで止めて、パスワードを決め直してもらう。それ以外は従来どおり素通し。
      if (otpIntent === 'reset') {
        pendingUser = data.user;
        btn.textContent = 'コードで進む'; btn.disabled = false;
        showPasswordStep();
        return;
      }

      await afterLogin(data.user);
    }

    /* ── 再設定の段 ──
       この時点でセッションは張れている（＝ログイン済み）。afterLogin はまだ呼ばず、
       保存かスキップのどちらかで必ず呼ぶ。afterLogin 側は一切いじらない。 */
    function showPasswordStep() {
      resetMsg(document.getElementById('pw-error'));
      document.getElementById('login-form').style.display    = 'none';
      document.getElementById('email-step').style.display    = 'none';
      document.getElementById('otp-step').style.display      = 'none';
      document.getElementById('password-step').style.display = 'block';
      document.getElementById('pw-new').focus();
    }

    async function savePasswordAndContinue() {
      const errEl = document.getElementById('pw-error');
      const btn   = document.getElementById('pw-save-btn');
      const pass  = document.getElementById('pw-new').value;
      const conf  = document.getElementById('pw-confirm').value;
      resetMsg(errEl);
      const fail = (t) => { errEl.textContent = t; errEl.style.display = 'block'; };

      if (pass.length < 8) { fail('パスワードは8文字以上で設定してください'); return; }
      if (pass !== conf)   { fail('確認用のパスワードが一致しません'); return; }

      btn.textContent = '保存中…'; btn.disabled = true;
      const { error } = await sb.auth.updateUser({ password: pass });

      if (error) {
        const m = error.message || '';
        btn.textContent = '保存して進む'; btn.disabled = false;
        // profile.html の savePassword と同じ扱い。Secure password change 有効時だけ言い換える。
        if (/reauth|nonce/i.test(m)) { fail('安全のため、一度ログインし直してからもう一度お試しください。'); return; }
        fail(m || 'パスワードを保存できませんでした。時間をおいて再度お試しください。');
        return;
      }

      await afterLogin(pendingUser);
    }

    // 設定しないまま進む。口コミ投稿の途中で人を止めないための逃げ道。
    async function skipPassword() {
      document.getElementById('pw-skip-btn').disabled = true;
      await afterLogin(pendingUser);
    }

    // 確認欄で Enter を押したらそのまま保存する
    document.getElementById('pw-confirm').addEventListener('keydown', function(e){
      if (e.key === 'Enter') { e.preventDefault(); savePasswordAndContinue(); }
    });

    // 6桁そろったら自動で送る（コードは数字だけに矯正する）
    /* ★全角の１２３４５６を先に半角へ寄せる。ここを飛ばすと \D が全部消して
         欄が空になり、貼った人には「効かない」としか見えない（pay-login.js と同じ）。 */
    document.getElementById('otp-code').addEventListener('input', function(){
      this.value = this.value
        .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
        .replace(/\D/g, '').slice(0, 6);
      if (this.value.length === 6) verifyOtpCode();
    });

    async function handleGoogle() {
      /* ★戻り先を auth-callback にも引き継ぐ。ここで落としていたので
         Google で入った人は必ず profile.html に着地していた。
         ※redirectTo は Supabase の Redirect URLs に登録済みの本番URLのまま。
           localhost を入れるにはダッシュボード側の許可が要るので触らない。

         ★同意画面に出るドメインはここでは決まらない。
           Google が表示するのは OAuth の redirect_uri
           = https://<project-ref>.supabase.co/auth/v1/callback のホスト名で、
           この redirectTo は Google から戻った「後」の Supabase 側の転送先。
           表示を PILOT VALUE にするのは Google Cloud Console の
           「Google Auth Platform → ブランディング」＋本番公開。ここを触っても変わらない。 */
      const to = getRedirect();
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://pilot-value.com/auth-callback.html'
                    + (to === 'profile.html' ? '' : '?next=' + encodeURIComponent(to)),
        }
      });
    }
  </script>
<script src="lang-toggle.js"></script>
<script src="currency.js"></script>
</body>
</html>
