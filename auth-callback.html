<style>
  body{margin:0;background:#0a0c0f;color:#e8edf2;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}

<body>
<div class="spinner"></div>
<p id="msg">ログイン処理中…</p>
<div id="debug"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="pv-reunlock.js"></script>
<script>
(async function() {
  const SB_URL = 'https://vzgmnkrggrwtsrpqndsm.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Z21ua3JnZ3J3dHNycHFuZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MzkwOTcsImV4cCI6MjA5MDAxNTA5N30.wE4cJbqeYGCgn5ZvHd80hYWgQuySKvOMJMbsJWOvmtw';

  function showError(msg) {
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('msg').textContent = 'ログインに失敗しました';
    const d = document.getElementById('debug');
    d.textContent = msg;
    d.style.display = 'block';
    setTimeout(() => { window.location.replace('login.html?error=1'); }, 4000);
  }

  const params = new URLSearchParams(location.search);

  /* ★戻り方は2通りある。
       pkce     … ?code=…          （呼び出し元が flowType:'pkce' のとき）
       implicit … #access_token=…  （flowType を省くと supabase-js はこちらが既定）
     以前は ?code= だけを見ていたので、呼び出し元が1枚でも pkce を指定し忘れると
     ここで必ず「認証コードが見つかりません」に落ちた。両方受ける。 */
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));

  // Google 側のエラーは search にも hash にも来る
  const urlError = params.get('error') || hash.get('error');
  if (urlError) {
    showError('エラー: ' + urlError + ' — ' +
      (params.get('error_description') || hash.get('error_description') || ''));
    return;
  }

  const code         = params.get('code');
  const accessToken  = hash.get('access_token');
  const refreshToken = hash.get('refresh_token');

  if (!code && !accessToken) {
    showError('認証コードが見つかりません。もう一度ログインしてください。');
    return;
  }

  // トークンを URL バーと履歴に残さない（この時点で値は控えてある）
  if (accessToken) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }

  // detectSessionInUrl: true（デフォルト）でSupabaseが自動的にPKCE交換する
  const sb = supabase.createClient(SB_URL, SB_KEY, {
    auth: { flowType: code ? 'pkce' : 'implicit' }
  });

  let handled = false;

  async function onSuccess(session) {
    if (handled) return;
    handled = true;
    const u = session.user;
    const name = u.user_metadata?.full_name || u.user_metadata?.name || u.email?.split('@')[0] || 'User';
    localStorage.setItem('pv_user', JSON.stringify({ id: u.id, email: u.email, name }));

    try { if (window.pvCheckReunlock) await pvCheckReunlock(sb, u.id); } catch(e) {}

    /* next パラメータがあればそこへ、なければprofile。
       ★.html で終わるだけを条件にすると ?next=https://evil.com/x.html が通り、
         ログイン直後に外部サイトへ飛ばせてしまう（オープンリダイレクト）。
         拡張子ではなく「同一オリジンに解決されるか」で判定する。 */
    const raw = new URLSearchParams(location.search).get('next') || '';
    let next = '';
    if (raw && !/^[a-z][a-z0-9+.-]*:/i.test(raw) && !raw.startsWith('//') && !raw.includes('\\')) {
      try {
        const u = new URL(raw, location.href);
        if (u.origin === location.origin) next = u.pathname + u.search + u.hash;
      } catch (e) { next = ''; }
    }
    window.location.replace(next || 'profile.html');
  }

  // onAuthStateChange でSIGNED_INを待つ（PKCEの自動交換後に発火）
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) {
      await onSuccess(session);
    }
  });

  // implicit で戻ってきた場合は、拾ったトークンから自分でセッションを張る。
  // detectSessionInUrl が先に食っていれば handled が立っているので二重にはならない。
  if (accessToken && !handled) {
    const { data, error } = await sb.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken || ''
    });
    if (data && data.session) { await onSuccess(data.session); return; }
    if (error && !handled) {
      showError('セッションを開始できませんでした: ' + error.message);
      return;
    }
  }

  // すでにセッションがある場合（リロード時など）
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    await onSuccess(session);
    return;
  }

  // 15秒タイムアウト
  setTimeout(() => {
    if (!handled) showError('タイムアウトしました。もう一度ログインを試してください。');
  }, 15000);
})();
</script>

</body>
