  <style>

    .step-sub{font-size:.8rem;color:#6b7d93;margin-bottom:24px}
    .auth-input{width:100%;padding:12px 15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e8edf2;font-size:.88rem;outline:none;transition:border-color .2s;font-family:inherit}
    /* ★iOS は 16px 未満の入力欄に触れるとページごと拡大し、戻らない。拡大した画面では
       position:fixed のヘッダーと常設バーが窓より広い箱になり、左右とも切れる
       （2026-08-27、オーナーの iPhone 16 で実測 1.09 倍）。⚠️ この 16px を下げない。 */

    .btn-secondary{width:100%;padding:12px;background:rgba(255,255,255,.06);color:#9ca3af;border:1px solid rgba(255,255,255,.1);border-radius:11px;font-weight:600;font-size:.88rem;cursor:pointer;transition:background .2s;font-family:inherit}

    .theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.07);color:#e8edf2;border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .2s}

    [data-theme="light"] .optin-text{color:#3f4a5a}
    /* 認証方法の選択（login.html と同じ見た目に揃える） */
    .btn-oauth{width:100%;padding:13px;background:rgba(255,255,255,.06);color:#e8edf2;border:1px solid rgba(255,255,255,.11);border-radius:11px;font-weight:600;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s;font-family:inherit}
    .btn-oauth:hover{background:rgba(255,255,255,.11)}
    .btn-oauth:focus-visible{outline:2px solid rgba(245,200,66,.6);outline-offset:2px}
    [data-theme="light"] .btn-oauth{background:rgba(0,0,0,.04);color:#0f172a;border-color:rgba(0,0,0,.12)}
    .divider{display:flex;align-items:center;gap:12px;color:#6b7d93;font-size:.76rem;margin:18px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08)}
    [data-theme="light"] .divider::before,[data-theme="light"] .divider::after{background:rgba(0,0,0,.08)}
    /* 3本並ぶと語中から折れて読めなくなる。語は割らず、行で折り返す。 */
    .btn-link{background:none;border:none;color:#6b7d93;font-size:.8rem;cursor:pointer;font-family:inherit;padding:6px;border-radius:8px;white-space:nowrap;transition:color .2s}
    .btn-link:hover{color:#f5c842}
    .btn-link:focus-visible{outline:2px solid rgba(245,200,66,.6);outline-offset:2px}
    .btn-link:disabled{opacity:.5;cursor:not-allowed}
    .otp-code{text-align:center;letter-spacing:.45em;font-size:1.15rem;font-weight:700;text-indent:.45em}

    [data-theme="light"] .error-msg.is-ok{color:#15803d;background:rgba(21,128,61,.07);border-color:rgba(21,128,61,.22)}
    /* サイト共通の扱い（index.html:557 と同じ）。金色は白地で 1.8:1 しか出ない。 */
    [data-theme="light"] [style*="color:#f5c842"]{color:#8a6e00!important}

<body>
  <div style="position:fixed;top:16px;right:16px;z-index:10">
    <button id="theme-toggle" class="theme-toggle" aria-label="テーマ切替"></button>
  </div>
  <div style="position:fixed;top:16px;left:16px;z-index:10">
    <a href="login.html" style="font-size:.82rem;color:#6b7d93;text-decoration:none;display:flex;align-items:center;gap:5px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M5 12l7-7M5 12l7 7"/></svg>
      ログインへ
    </a>
  </div>

  <div class="auth-card">
    <div style="text-align:center;margin-bottom:28px">
      <a href="index.html"><img src="assets/logo.png" alt="PILOT VALUE" style="height:32px;margin:0 auto"/></a>
    </div>
    <div class="step-dots">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
    </div>

    <!-- STEP 1 -->
    <div id="step-1">
      <div class="step-title">アカウントを作成</div>
      <div class="step-sub">好きな方法を選んでください。このあとプロフィールを設定します</div>

      <!-- ★入口は3つ。ただしどれで認証しても必ず段2（プロフィール）へ着地させる。
           在籍企業と職位はここでしか取れない一次データなので、入口を増やしても取りこぼさない。
           押す回数が少ない順に置く。 -->
      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" class="btn-oauth" onclick="signupGoogle()">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Googleで登録
        </button>
        <button type="button" class="btn-oauth" onclick="showEmailStep()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
          メールにコードを送る
        </button>
      </div>

      <div class="divider">またはパスワードを設定する</div>

      <form id="step1-form" onsubmit="goStep2(event)" novalidate>
        <div style="display:flex;flex-direction:column;gap:11px;margin-bottom:16px">
          <div><div class="field-label">メールアドレス</div><input class="auth-input" type="email" id="s1-email" placeholder="pilot@example.com" autocomplete="email" required/></div>
          <div><div class="field-label">パスワード（8文字以上）</div><input class="auth-input" type="password" id="s1-pass" placeholder="••••••••" autocomplete="new-password" required minlength="8"/></div>
          <div><div class="field-label">パスワード（確認）</div><input class="auth-input" type="password" id="s1-pass2" placeholder="••••••••" autocomplete="new-password" required/></div>
          <div class="error-msg" id="step1-error"></div>
        </div>
        <button type="submit" class="btn-primary">次へ → プロフィール設定</button>
      </form>
      <div style="text-align:center;margin-top:20px;font-size:.83rem;color:#6b7d93">
        既にアカウントをお持ちの方は <a href="login.html" style="color:#f5c842;font-weight:700;text-decoration:none">ログイン</a>
      </div>
    </div>

    <!-- 宛先を入れる段。押した人に「どこに届くのか」が必ず見える形にする。 -->
    <div id="email-step" style="display:none">
      <div class="step-title">メールで登録</div>
      <div class="step-sub">6桁のログインコードをお送りします。パスワードは要りません</div>
      <div style="display:flex;flex-direction:column;gap:11px;margin-bottom:16px">
        <div><div class="field-label">メールアドレス</div>
          <input class="auth-input" type="email" id="otp-email" placeholder="you@example.com"
                 autocomplete="email" inputmode="email"/></div>
        <div class="error-msg" id="email-error"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" class="btn-primary" id="otp-send-btn" onclick="sendOtp()">確認メールを送る</button>
        <button type="button" class="btn-secondary" onclick="backToStep1()">← 戻る</button>
      </div>
    </div>

    <!-- コード入力。メールには6桁コードしか載せていない（2026-08-22 に
         Supabase のテンプレートから {{ .ConfirmationURL }} を外した）。
         リンクは別ブラウザを開いてしまい、給与データの預かり証を失わせるため。 -->
    <div id="otp-step" style="display:none">
      <div class="step-title">コードを入力</div>
      <div class="step-sub" id="otp-note"></div>
      <div style="display:flex;flex-direction:column;gap:11px;margin-bottom:16px">
        <input class="auth-input otp-code" type="text" id="otp-code" inputmode="numeric" pattern="[0-9]*"
               autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="6桁のコード"/>
        <div class="error-msg" id="otp-error"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button type="button" class="btn-primary" id="otp-verify-btn" onclick="verifyOtpCode()">コードで進む</button>
        <div style="display:flex;justify-content:center;gap:6px 14px;flex-wrap:wrap">
          <button type="button" class="btn-link" id="otp-resend-btn" onclick="sendOtp()">メールを再送する</button>
          <button type="button" class="btn-link" onclick="showEmailStep()">アドレスを変える</button>
          <button type="button" class="btn-link" onclick="backToStep1()">別の方法で登録</button>
        </div>
      </div>
    </div>

    <!-- STEP 2 -->
    <div id="step-2" style="display:none">
      <div class="profile-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        プロフィール登録必須
      </div>
      <div class="step-title">プロフィールを設定</div>
      <div class="step-sub">口コミの信頼性のため必須です（匿名で表示されます）</div>
      <form id="step2-form" onsubmit="handleSignup(event)" novalidate>
        <div style="display:flex;flex-direction:column;gap:14px;margin-bottom:18px">
          <div><div class="field-label">氏名</div><input class="auth-input" type="text" id="s2-name" placeholder="山田 太郎" required/></div>
          <div>
            <div class="field-label">性別</div>
            <div class="radio-group">
              <div class="radio-chip"><input type="radio" name="gender" id="g-male" value="male"/><label for="g-male">男性</label></div>
              <div class="radio-chip"><input type="radio" name="gender" id="g-female" value="female"/><label for="g-female">女性</label></div>
              <div class="radio-chip"><input type="radio" name="gender" id="g-other" value="other"/><label for="g-other">その他</label></div>
            </div>
          </div>
          <div><div class="field-label">生年月日</div><input class="auth-input" type="date" id="s2-birth" required style="color-scheme:dark"/></div>
          <div>
            <div class="field-label">居住国</div>
            <select class="auth-input" id="s2-country" required>
              <option value="">選択してください</option>
              <option>日本</option><option>アメリカ</option><option>UAE</option>
              <option>シンガポール</option><option>香港</option><option>イギリス</option>
              <option>ドイツ</option><option>フランス</option><option>オーストラリア</option>
              <option>カナダ</option><option>韓国</option><option>中国</option><option>その他</option>
            </select>
          </div>
          <div><div class="field-label">在籍企業</div><input class="auth-input" type="text" id="s2-company" placeholder="例: ANA、JAL、Emirates" required/></div>
          <div>
            <div class="field-label">職位</div>
            <div class="radio-group">
              <div class="radio-chip"><input type="radio" name="position" id="p-cap" value="captain"/><label for="p-cap">機長</label></div>
              <div class="radio-chip"><input type="radio" name="position" id="p-fo" value="fo"/><label for="p-fo">副操縦士</label></div>
              <div class="radio-chip"><input type="radio" name="position" id="p-cad" value="cadet"/><label for="p-cad">訓練生</label></div>
            </div>
          </div>
          <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:12px 14px;background:rgba(245,200,66,.06);border:1px solid rgba(245,200,66,.18);border-radius:10px">
            <input type="checkbox" id="s2-optin" checked style="margin-top:2px;width:16px;height:16px;accent-color:#f5c842;flex:none"/>

              年収データの更新・新着口コミ・新規エアライン情報などの<b>有益な更新</b>と、<b>毎月の給与明細リマインド</b>をメールで受け取る<span style="color:#6b7d93">（リマインドは明細を1枚出した方に、ご自身の給料日ごろへ月1通。広告目的の配信はしません。いつでも1クリックで解除できます）</span>

          <!-- Google／コードで来た人は認証が済んでいる。戻る先が無いので隠す。 -->

    <!-- SUCCESS -->
    <div class="success-screen" id="success-screen">

      <div style="font-size:1.1rem;font-weight:700;margin-bottom:8px">登録完了！</div>
      <!-- 次にやることを1つだけ出す。明細は端末内匿名化を挟む重い経路なので、
           登録直後に見せない（口コミ → そのあと明細の順）。 -->
      <p style="font-size:.84rem;color:#6b7d93;line-height:1.7;margin-bottom:24px">

        <span id="success-lead">口コミを1件投稿すると、<b style="color:#f5c842">全社の口コミが解放</b>されます。</span>
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:280px;margin:0 auto">
        <!-- ★既定は「口コミを書く」。ただし ?next= で来た人（口コミ／明細を出そうとして
             ログイン壁に当たり、そこから登録に回された人）は、その元の場所へ戻す。
             本文・ボタンの文言・行き先の3つとも showSuccessCta() が差し替える

        <button class="btn-primary" id="success-cta" onclick="window.location.href=(this.dataset.href||'submit-review.html')">匿名で口コミを書く（約60秒）</button>
        <button class="btn-secondary" id="success-later" onclick="window.location.href='profile.html?welcome=1'">あとで書く → サイトへ</button>
      </div>

  </div>

  <script>
    const SB_URL = 'https://vzgmnkrggrwtsrpqndsm.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Z21ua3JnZ3J3dHNycHFuZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MzkwOTcsImV4cCI6MjA5MDAxNTA5N30.wE4cJbqeYGCgn5ZvHd80hYWgQuySKvOMJMbsJWOvmtw';
    /* ★flowType を省くと supabase-js の既定＝implicit になり、Google が
         #access_token= で返す。auth-callback.html は ?code= を見ているので必ず弾かれる。
         login.html:205 と同じ pkce に揃える。 */
    const sb = supabase.createClient(SB_URL, SB_KEY, {
      auth: { flowType: 'pkce' }
    });

    const SUN = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
    const MOON = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    function applyTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem('pv-theme',t);const b=document.getElementById('theme-toggle');if(b)b.innerHTML=t==='dark'?SUN:MOON;}
    applyTheme(localStorage.getItem('pv-theme')||'light');
    document.getElementById('theme-toggle').addEventListener('click',function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});

    /* ★戻り先のパラメータ名がサイト内で3種類に割れている（login.html と同じ事情）。
         next=     … submit-review.html / pay-report.html から来た人
         redirect= … ここが元々見ていた唯一の名前
         return=   … airlines/ 配下
       redirect しか読んでいなかったので、「口コミを書こうとして登録した人」が
       全員 profile.html に落ちていた。3つとも受ける。

       ★戻り先は location.href に入る。同一オリジンに解決されることを必ず確かめる
         （?redirect=https://evil.com を素通しすると外部サイトへ飛ばせてしまう）。 */
    function safePath(to){
      if (!to) return '';
      if (/^[a-z][a-z0-9+.-]*:/i.test(to)) return '';      // http: javascript: data: …
      if (to.startsWith('//') || to.includes('\\')) return '';
      try {
        const u = new URL(to, location.href);
        return u.origin === location.origin ? u.pathname + u.search + u.hash : '';
      } catch (e) { return ''; }
    }
    // 明示的に指定された戻り先だけ（無ければ空文字）。既定値と区別したいので分けてある。
    function explicitNext(){
      const q = new URLSearchParams(location.search);
      return safePath(q.get('next') || q.get('redirect') || q.get('return')) || '';
    }
    function getRedirect(){ return explicitNext() || 'profile.html?welcome=1'; }

    /* 登録完了画面の主ボタン。?next= で来た人は、登録の前にやろうとしていたこと
       （口コミ／明細）へ戻す。ここを既定の submit-review.html 固定にしていたため、
       明細を出しに来た人まで口コミへ送っていた。 */
    function showSuccessCta(){
      const b = document.getElementById('success-cta');
      const to = explicitNext();
      if (!b || !to) return;
      b.dataset.href = to;
      // ★ファイル名だけで見る。/en/ 配下では to が '/en/pay-report.html' になり、
      //   パス全体で比べると英語側が分岐に入らない（英語版で実際に起きた）。両方同じ形にする。
      const p = to.split(/[?#]/)[0].split('/').pop();
      if (p === 'pay-report.html') {
        b.textContent = '給与明細を出す（約2分）';
        // 年収の解放は明細だけ（pay-report.html の submit_pay_report が access_until を90日先へ延ばす）
        const lead = document.getElementById('success-lead');
        if (lead) lead.innerHTML = '明細を1枚出すと、<b style="color:#f5c842">全社の年収データが90日間解放</b>されます。';
        const later = document.getElementById('success-later');
        if (later) later.textContent = 'あとで出す → サイトへ';
      } else if (p !== 'submit-review.html') {
        b.textContent = '続ける →';
      }
    }

    /* ── 認証の入口は3つ、着地は1つ ──
       'password' … まだユーザーが居ない。段2の送信で signUp する（従来の経路）
       'session'  … Google／コードで既に認証済み。ユーザーは作らず profiles を埋める
       どちらでも段2（プロフィール）を必ず通す。在籍企業と職位はここでしか取れない。 */
    let authMode     = 'password';
    let signupMethod = 'email';     // GA4 の method に入れる
    let otpEmail     = '';

    function show(id, on){ const el = document.getElementById(id); if (el) el.style.display = on ? 'block' : 'none'; }

    // .error-msg は赤。再送の「送りました」だけ緑（.is-ok）にするので、次に使う前に必ず戻す。
    function resetMsg(el){ el.style.display='none'; el.classList.remove('is-ok'); }

    /* 戻り先は Google の往復をまたぐ。?redirect= を落とさないよう search ごと持ち回る。 */
    function callbackUrl(){
      return 'https://pilot-value.com/auth-callback.html?next='
           + encodeURIComponent('signup.html' + location.search);
    }

    function goStep2(e) {
      e.preventDefault();
      const pass = document.getElementById('s1-pass').value;
      const pass2= document.getElementById('s1-pass2').value;
      const errEl= document.getElementById('step1-error');
      errEl.style.display='none';
      if(pass.length<8){errEl.textContent='パスワードは8文字以上で設定してください';errEl.style.display='block';return;}
      if(pass!==pass2){errEl.textContent='パスワードが一致しません';errEl.style.display='block';return;}
      authMode = 'password'; signupMethod = 'email';
      enterProfileStep();
    }

    function enterProfileStep() {
      ['step-1','email-step','otp-step'].forEach(function(id){ show(id, false); });
      show('step-2', true);
      document.getElementById('dot-1').classList.remove('active');
      document.getElementById('dot-1').classList.add('done');
      document.getElementById('dot-2').classList.add('active');
      // 認証が済んでいる人には戻り先が無い
      show('step2-back', authMode !== 'session');
    }

    function backToStep1() {
      ['step-2','email-step','otp-step'].forEach(function(id){ show(id, false); });
      show('step-1', true);
      document.getElementById('dot-2').classList.remove('active');
      document.getElementById('dot-1').classList.remove('done');
      document.getElementById('dot-1').classList.add('active');
    }

    /* ── ① Google ── auth-callback を経由して、この画面の段2に戻ってくる */
    async function signupGoogle(){
      await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: callbackUrl() } });
    }

    /* ── ② メールのコード ── */
    function showEmailStep(){
      const input = document.getElementById('otp-email');
      const typed = document.getElementById('s1-email').value.trim();
      if (typed && !input.value) input.value = typed;      // 下のフォームに打ちかけていたら引き継ぐ
      resetMsg(document.getElementById('email-error'));
      resetMsg(document.getElementById('otp-error'));
      ['step-1','otp-step','step-2'].forEach(function(id){ show(id, false); });
      show('email-step', true);
      input.focus();
    }

    async function sendOtp(){
      const sendBtn   = document.getElementById('otp-send-btn');
      const resendBtn = document.getElementById('otp-resend-btn');
      const input     = document.getElementById('otp-email');

      /* 再送はコード入力の段から押される。そのとき #email-step は隠れていて、
         その中の #email-error に書いても誰にも見えない。出す先を段で選ぶ。 */
      const onOtpStep = document.getElementById('otp-step').style.display === 'block';
      const errEl = document.getElementById(onOtpStep ? 'otp-error' : 'email-error');
      resetMsg(errEl);

      // 再送は「さっき送った宛先」に送る。入力欄を触られていても宛先は変えない。
      const email = onOtpStep ? otpEmail : input.value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        errEl.textContent='メールアドレスを正しく入力してください';
        errEl.style.display='block';
        if(!onOtpStep) input.focus();
        return;
      }

      const active = onOtpStep ? resendBtn : sendBtn;
      const label  = active.innerHTML;
      active.disabled = true; active.textContent = '送信中…';

      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: callbackUrl(), shouldCreateUser: true }
      });

      active.disabled = false; active.innerHTML = label;

      if(error){
        errEl.textContent = (error.status === 429)
          ? '送信の間隔が短すぎます。少し時間をおいてからお試しください。'
          : 'メールを送信できませんでした: ' + error.message;
        errEl.style.display='block';
        return;
      }

      otpEmail = email;
      if(onOtpStep){
        errEl.textContent='メールを再送しました。';
        errEl.classList.add('is-ok');
        errEl.style.display='block';
      }
      document.getElementById('otp-note').innerHTML =
        '<b>' + email.replace(/[<>&]/g,'') + '</b> にメールを送りました。'
        + 'この画面に、届いた6桁のコードを入力してください。';
      show('email-step', false);
      show('otp-step', true);
      document.getElementById('otp-code').focus();
    }

    document.getElementById('otp-email').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); sendOtp(); }
    });

    async function verifyOtpCode(){
      const token = document.getElementById('otp-code').value.trim();
      const errEl = document.getElementById('otp-error');
      const btn   = document.getElementById('otp-verify-btn');
      resetMsg(errEl);

      if(!/^\d{6}$/.test(token)){
        errEl.textContent='6桁の数字を入力してください';
        errEl.style.display='block';
        return;
      }

      btn.textContent='確認中…'; btn.disabled=true;
      const { data, error } = await sb.auth.verifyOtp({ email: otpEmail, token, type:'email' });

      if(error || !data || !data.user){
        errEl.textContent='コードが正しくないか、有効期限が切れています。再送してお試しください。';
        errEl.style.display='block';
        btn.textContent='コードで進む'; btn.disabled=false;
        return;
      }

      authMode = 'session'; signupMethod = 'otp';
      prefillProfile(data.user, null);
      enterProfileStep();
    }

    // 6桁そろったら自動で送る（数字だけに矯正する）
    /* ★全角の１２３４５６を先に半角へ寄せる。ここを飛ばすと \D が全部消して
         欄が空になり、貼った人には「効かない」としか見えない（pay-login.js と同じ）。 */
    document.getElementById('otp-code').addEventListener('input', function(){
      this.value = this.value
        .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
        .replace(/\D/g, '').slice(0, 6);
      if (this.value.length === 6) verifyOtpCode();
    });

    /* 既に埋まっている値は打ち直させない。Google は氏名を metadata で持ってくる。 */
    function prefillProfile(user, profile){
      const m = (user && user.user_metadata) || {};
      const set = function(id, v){ if(v) document.getElementById(id).value = v; };
      set('s2-name',    (profile && profile.name) || m.full_name || m.name);
      set('s2-company', profile && profile.company);
      set('s2-country', profile && profile.country);
      set('s2-birth',   profile && profile.birthdate);
      const g = profile && profile.gender;   if(g){ const el=document.querySelector('input[name="gender"][value="'+g+'"]');   if(el) el.checked=true; }
      const p = profile && profile.position; if(p){ const el=document.querySelector('input[name="position"][value="'+p+'"]'); if(el) el.checked=true; }
    }

    /* Google から auth-callback 経由で戻ってきた／既にログイン済みで開いた場合の受け皿。
       プロフィールが埋まっているなら登録済みなので、そのままサイトへ通す。 */
    (async function(){
      const { data:{ session } } = await sb.auth.getSession();
      if(!session) return;
      const { data: p } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      if(p && p.name && p.company && p.position){ window.location.href = getRedirect(); return; }
      authMode = 'session';
      if(signupMethod === 'email') signupMethod = 'google';   // OTP は verifyOtpCode で既に立っている
      prefillProfile(session.user, p);
      enterProfileStep();
    })();

    async function handleSignup(e) {
      e.preventDefault();
      const errEl = document.getElementById('step2-error');
      const btn   = document.getElementById('signup-btn');
      errEl.style.display='none';

      const name     = document.getElementById('s2-name').value.trim();
      const gender   = document.querySelector('input[name="gender"]:checked');
      const birth    = document.getElementById('s2-birth').value;
      const country  = document.getElementById('s2-country').value;
      const company  = document.getElementById('s2-company').value.trim();
      const position = document.querySelector('input[name="position"]:checked');

      if(!name)    {errEl.textContent='氏名を入力してください';errEl.style.display='block';return;}
      if(!gender)  {errEl.textContent='性別を選択してください';errEl.style.display='block';return;}
      if(!birth)   {errEl.textContent='生年月日を入力してください';errEl.style.display='block';return;}
      if(!country) {errEl.textContent='居住国を選択してください';errEl.style.display='block';return;}
      if(!company) {errEl.textContent='在籍企業を入力してください';errEl.style.display='block';return;}
      if(!position){errEl.textContent='職位を選択してください';errEl.style.display='block';return;}

      const optIn   = !!(document.getElementById('s2-optin') && document.getElementById('s2-optin').checked);
      const optInAt = optIn ? new Date().toISOString() : null;
      const meta = { name, gender: gender.value, birthdate: birth, country, company,
                     position: position.value, email_opt_in: optIn, email_opt_in_at: optInAt };

      btn.textContent='登録中…'; btn.disabled=true;

      const fail = function(msg){
        errEl.textContent = msg; errEl.style.display='block';
        btn.textContent='登録を完了する'; btn.disabled=false;
      };

      let userId, email;

      if (authMode === 'session') {
        // Google／コードで既に認証済み。ユーザーは作らず metadata を足すだけ。
        // profiles の行は handle_new_user トリガーが作成済みなので、下の upsert が中身を埋める。
        const { data: u, error: uErr } = await sb.auth.updateUser({ data: meta });
        if (uErr || !u || !u.user) {
          return fail('プロフィールを保存できませんでした: ' + ((uErr && uErr.message) || '不明なエラー'));
        }
        userId = u.user.id;
        email  = u.user.email;
      } else {
        email = document.getElementById('s1-email').value.trim().toLowerCase();
        const pass = document.getElementById('s1-pass').value;

        // Supabase authにユーザー作成（プロフィール項目をmetadataに渡す→トリガーがprofilesを自動作成）
        // metadata は JSON なので未知キーでも安全。email_opt_in はトリガー側で profiles に反映。
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: meta } });
        if(error){
          return fail(error.message === 'User already registered'
            ? 'このメールアドレスは既に登録されています'
            : 'エラーが発生しました: ' + error.message);
        }
        if(!data.user){
          return fail('Supabase管理画面でメール確認をOFFにしてください（Authentication → Sign In / Providers → Confirm email）');
        }
        // セッションが未確立の場合はサインインしてセッションを取得
        if(!data.session){
          const { error: signInErr } = await sb.auth.signInWithPassword({ email, password: pass });
          if(signInErr) return fail('ログインに失敗しました: ' + signInErr.message);
        }
        userId = data.user.id;
      }

      const profileData = { name, gender: gender.value, birthdate: birth, country, company, position: position.value };
      const optInCols  = { email_opt_in: optIn, email_opt_in_at: optInAt };

      // 3. プロフィールをDBに保存（トリガーでも自動作成されるため、RLS等で失敗しても登録は継続）
      //    email_opt_in 列が未追加（マイグレーション前）でも登録を止めないようフォールバック。
      let { error: upsertErr } = await sb.from('profiles').upsert({ id: userId, email, ...profileData, ...optInCols });
      if (upsertErr && /email_opt_in/i.test((upsertErr.message||'') + (upsertErr.details||''))) {
        ({ error: upsertErr } = await sb.from('profiles').upsert({ id: userId, email, ...profileData }));
      }
      if(upsertErr){ console.warn('profiles upsert failed; handle_new_user trigger will populate:', upsertErr.message); }

      /* ★同意の旗は2つある。上の upsert が立てるのは親（email_opt_in）だけで、
         月次リマインドの子（mail_optin）は既定 false のまま残っていた。送信条件は
         pv_reminder_due で「両方 true」なので、これが原因で宛先が恒常的に0件だった
         （2026-08-11 に実測：mail_optin=true は27人中0人、pv_reminder_due は [] を返す）。
         列を直接書かず set_mail_optin を通す＝親と同意日時までサーバ側で揃うため。
         ここで失敗しても登録は止めない（同意はマイページから後で立て直せる）。 */
      if (optIn) {
        try { await sb.rpc('set_mail_optin', { p_on: true }); }
        catch (e) { console.warn('set_mail_optin failed:', e && e.message); }
      }

      // 4. localStorageにも保存（ナビ表示用）
      localStorage.setItem('pv_user', JSON.stringify({
        id: userId, email, name, gender: gender.value,
        birthdate: birth, country, company, position: position.value,
        joinedAt: new Date().toISOString()
      }));

      // pv-session.js の無操作カウントをここから開始する（login.html の afterLogin と同じ）
      try { localStorage.setItem('pv_last_active', String(Date.now()));
            localStorage.setItem('pv_session_start', String(Date.now())); } catch(e){}

      // 5. GA4 コンバージョン計測（新規登録）。どの入口が効いているかを見たいので method を分ける
      try { if (typeof gtag === 'function') gtag('event', 'sign_up', { method: signupMethod }); } catch(e) {}

      // 6. 成功画面へ
      document.getElementById('step-2').style.display='none';
      document.getElementById('success-screen').style.display='block';
      showSuccessCta();
    }
  </script>
