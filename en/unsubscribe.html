<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0c0f;color:#e8edf2;font-family:Inter,'Noto Sans JP',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.1);border-top-color:#f5c842;border-radius:50%;animation:spin .8s linear infinite;margin:6px auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn{display:inline-block;margin-top:22px;padding:11px 22px;background:#f5c842;color:#000;border-radius:10px;font-size:.84rem;font-weight:800;text-decoration:none}

<body>
  <div class="card" id="card">
    <div class="spinner" id="spin"></div>
    <h1 id="title">Processing your unsubscribe request…</h1>
    <p id="msg">Please wait a moment.</p>
  </div>
<script>
  const SB_URL = 'https://vzgmnkrggrwtsrpqndsm.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6Z21ua3JnZ3J3dHNycHFuZHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MzkwOTcsImV4cCI6MjA5MDAxNTA5N30.wE4cJbqeYGCgn5ZvHd80hYWgQuySKvOMJMbsJWOvmtw';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const spin = document.getElementById('spin');
  const title = document.getElementById('title');
  const msg = document.getElementById('msg');
  const card = document.getElementById('card');

  function render(icon, t, m, extra) {
    spin.style.display = 'none';
    card.innerHTML = `<div class="icon">${icon}</div><h1>${t}</h1><p>${m}</p>${extra || ''}`;
  }

  (async function () {
    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      render('⚠️', 'Invalid link', 'This URL does not contain an unsubscribe token. Please try again using the link in your email.',
        '<a class="btn" href="index.html">Back to home</a>');
      return;
    }
    try {
      // security definer RPC：unsub_token 一致で email_opt_in=false（ログイン不要）
      const { data, error } = await sb.rpc('unsubscribe', { p_token: token });
      if (error) throw error;
      if (data === false) {
        render('🤔', 'Link not found', 'You may have already unsubscribed, or the link may no longer be valid.',
          '<a class="btn" href="index.html">Back to home</a>');
        return;
      }
      render('✅', 'You have been unsubscribed', 'You will no longer receive update notification emails. Thank you for using our service.',
        '<div class="resub">Changed your mind? You can <a onclick="resubscribe(\'' + token.replace(/'/g,'') + '\')">resubscribe</a>.</div>');
    } catch (e) {
      render('⚠️', 'Unsubscribe failed', 'Please try again later using the link in your email. If the problem persists, contact us at info@pilot-value.com.',
        '<a class="btn" href="index.html">Back to home</a>');
    }
  })();

  async function resubscribe(token) {
    try {
      const { data, error } = await sb.rpc('resubscribe', { p_token: token });
      if (error) throw error;
      render('🔔', 'You have been resubscribed', 'We will send you useful updates by email.', '<a class="btn" href="index.html">Back to home</a>');
    } catch (e) {
      render('⚠️', 'Resubscribe failed', 'You can also change this setting under "Email notifications" on My Page.', '<a class="btn" href="profile.html">Go to My Page</a>');
    }
  }
</script>
